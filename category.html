<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOER - Browse category</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="wordmark" style="text-decoration:none;color:inherit;">DOER</a>
    <nav class="topnav">
      <a href="index.html" class="nav-link">Back to search</a>
    </nav>
  </header>

  <main class="hero">
    <p class="eyebrow">// category</p>
    <h1 class="headline" id="categoryTitle">Loading<span class="accent">...</span></h1>

    <div id="listingsArea">
      <p id="loadingMsg" style="color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 0.95rem;">
        Loading listings...
      </p>
      <div id="cardGrid" class="card-grid"></div>
    </div>

  </main>

  <footer class="footer">
    <p>DOER - get things done.</p>
  </footer>

<script src="script.js"></script>
<script>
  // Reads either ?type=<category-key> or ?q=<free text search>
  // and shows a friendly title. Relies on SERVICES from script.js.
  const params = new URLSearchParams(window.location.search);
  const type = params.get("type");
  const q = params.get("q");
  const titleEl = document.getElementById("categoryTitle");

  if (type && SERVICES[type]) {
    titleEl.innerHTML = `${SERVICES[type]}<span class="accent">.</span>`;
  } else if (q) {
    titleEl.innerHTML = `Results for<br><span class="accent">"${q.replace(/</g, "&lt;")}"</span>`;
  } else {
    titleEl.innerHTML = `Browse<span class="accent">.</span>`;
  }

  // ------------------------------------------------------------
  // Parse data/providers.txt into a list of provider objects.
  // Each entry is a block of "key: value" lines separated by a
  // line containing only "---". Blocks missing category or name
  // (like the CATEGORIES reference list at the top of the file)
  // are skipped automatically.
  // ------------------------------------------------------------
  function parseProviders(text) {
    const blocks = text.split(/^---\s*$/m);
    const providers = [];

    for (const block of blocks) {
      const lines = block.split("\n");
      const entry = {};

      for (const line of lines) {
        const match = line.match(/^\s*(category|name|stars|price|other|photo)\s*:\s*(.*)$/i);
        if (!match) continue;
        const key = match[1].toLowerCase();
        const value = match[2].trim();
        if (value) entry[key] = value;
      }

      // Require both category and name; this is what skips the
      // CATEGORIES reference block and the blank template block.
      if (entry.category && entry.name) {
        providers.push(entry);
      }
    }

    return providers;
  }

  function starsDisplay(starsValue) {
    const num = parseFloat(starsValue);
    if (isNaN(num)) return "";
    const rounded = Math.round(num * 2) / 2; // nearest half star
    const full = Math.floor(rounded);
    const half = rounded - full === 0.5;
    let str = "\u2605".repeat(full);
    if (half) str += "\u00BD";
    return `${str} <span style="color: var(--text-dim);">(${num})</span>`;
  }

  function renderCard(entry) {
    const card = document.createElement("div");
    card.className = "provider-card";

    let html = "";

    if (entry.photo) {
      html += `<img class="provider-photo" src="${entry.photo}" alt="${entry.name}" loading="lazy" onerror="this.style.display='none'">`;
    }

    html += `<div class="provider-body">`;
    html += `<p class="provider-name">${entry.name}</p>`;

    if (entry.stars) {
      html += `<p class="provider-stars">${starsDisplay(entry.stars)}</p>`;
    }

    if (entry.price) {
      html += `<p class="provider-price">${entry.price}</p>`;
    }

    if (entry.other) {
      html += `<p class="provider-other">${entry.other}</p>`;
    }

    html += `</div>`;
    card.innerHTML = html;
    return card;
  }

  async function loadListings() {
    const loadingMsg = document.getElementById("loadingMsg");
    const grid = document.getElementById("cardGrid");

    try {
      const res = await fetch("providers.txt");
      if (!res.ok) throw new Error("Could not load providers.txt");
      const text = await res.text();
      const allProviders = parseProviders(text);

      const matches = type
        ? allProviders.filter((p) => p.category.toLowerCase() === type.toLowerCase())
        : allProviders;

      if (matches.length === 0) {
        loadingMsg.textContent = "No listings yet for this category. Check back soon.";
        return;
      }

      loadingMsg.style.display = "none";
      matches.forEach((entry) => grid.appendChild(renderCard(entry)));
    } catch (err) {
      loadingMsg.textContent = "Couldn't load listings right now.";
      console.error(err);
    }
  }

  loadListings();
</script>
</body>
</html>
