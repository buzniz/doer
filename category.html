<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOER - Browse category</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="wordmark" style="text-decoration:none;color:inherit;">DOER</a>
    <nav class="topnav">
      <a href="index.html" class="nav-link">Back to search</a>
    </nav>
  </header>

  <main class="hero">
    <p class="eyebrow">// category</p>
    <h1 class="headline" id="categoryTitle">Loading<span class="accent">...</span></h1>

    <div id="listingsArea">
      <p id="loadingMsg" style="color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 0.95rem;">
        Loading listings...
      </p>
      <div id="cardGrid" class="card-grid"></div>
    </div>

  </main>

  <footer class="footer">
    <p>DOER - get things done.</p>
  </footer>

<script src="script.js" defer></script>
<script defer>
  // defer on both tags guarantees script.js has fully run (so
  // parseProviders/titleCase exist) before this block runs, and
  // that the DOM is ready. This removes the loading race that
  // could leave the page stuck on "Loading listings..." on a
  // slow first load.
  window.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const type = params.get("type");
    const q = params.get("q");
    const titleEl = document.getElementById("categoryTitle");

    if (type) {
      titleEl.innerHTML = `${titleCase(type)}<span class="accent">.</span>`;
    } else if (q) {
      titleEl.innerHTML = `Results for<br><span class="accent">"${q.replace(/</g, "&lt;")}"</span>`;
    } else {
      titleEl.innerHTML = `Browse<span class="accent">.</span>`;
    }

    loadListings(type);
  });

  function starsDisplay(starsValue) {
    const num = parseFloat(starsValue);
    if (isNaN(num)) return "";
    const rounded = Math.round(num * 2) / 2; // nearest half star
    const full = Math.floor(rounded);
    const half = rounded - full === 0.5;
    let str = "\u2605".repeat(full);
    if (half) str += "\u00BD";
    return `${str} <span style="color: var(--text-dim);">(${num})</span>`;
  }

  function renderCard(entry) {
    const card = document.createElement("div");
    card.className = "provider-card";

    let html = "";

    if (entry.photo) {
      const photoUrl = toRawGithubUrl(entry.photo);
      html += `<img class="provider-photo" src="${photoUrl}" alt="${entry.name}" loading="lazy" onerror="this.style.display='none'">`;
    }

    html += `<div class="provider-body">`;
    html += `<p class="provider-name">${entry.name}</p>`;

    if (entry.stars) {
      html += `<p class="provider-stars">${starsDisplay(entry.stars)}</p>`;
    }

    if (entry.price) {
      html += `<p class="provider-price">${entry.price}</p>`;
    }

    if (entry.other) {
      html += `<p class="provider-other">${entry.other}</p>`;
    }

    html += `</div>`;
    card.innerHTML = html;
    return card;
  }

  async function loadListings(type) {
    const loadingMsg = document.getElementById("loadingMsg");
    const grid = document.getElementById("cardGrid");

    try {
      const res = await fetch("providers.txt");
      if (!res.ok) throw new Error("Could not load providers.txt");
      const text = await res.text();
      const allProviders = parseProviders(text);

      const matches = type
        ? allProviders.filter((p) => p.category.toLowerCase() === type.toLowerCase())
        : allProviders;

      if (matches.length === 0) {
        loadingMsg.textContent = "No listings yet for this category. Check back soon.";
        return;
      }

      loadingMsg.style.display = "none";
      matches.forEach((entry) => grid.appendChild(renderCard(entry)));
    } catch (err) {
      loadingMsg.textContent = "Couldn't load listings right now.";
      console.error(err);
    }
  }
</script>
</body>
</html>
