<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyLocalTrades - Request</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="wordmark" style="text-decoration:none;color:inherit;">MLT</a>
    <nav class="topnav">
      <a href="index.html" class="nav-link">Back to search</a>
    </nav>
  </header>

  <main class="hero">
    <p class="eyebrow">// request</p>
    <h1 class="headline" id="requestTitle">Get in touch<span class="accent">.</span></h1>
    <p id="requestSubtitle" class="request-subtitle"></p>

    <div id="providerSummary" class="provider-summary" style="display:none;"></div>

    <div id="switchRow" class="switch-row" style="display:none;">
      <label class="form-label" for="providerSwitch">Choose a different provider</label>
      <select id="providerSwitch" class="location-select"></select>
    </div>

    <form
      id="requestForm"
      class="request-form"
      action="https://formspree.io/f/xaewdbar"
      method="POST"
    >
      <input type="hidden" name="requested_provider" id="hiddenProvider">
      <input type="hidden" name="requested_category" id="hiddenCategory">

      <label class="form-label" for="fromName">Your name</label>
      <input class="form-input" type="text" id="fromName" name="Your name" required>

      <label class="form-label" for="fromContact">Your email or phone</label>
      <input class="form-input" type="text" id="fromContact" name="Your contact info" required>

      <label class="form-label" for="message">Please specify the details of your problem</label>
      <textarea class="form-input" id="message" name="Message" rows="5" required></textarea>

      <button class="prompt-go" type="submit" style="margin-top: 1rem;">Send request</button>
    </form>

    <div id="successMsg" class="request-success" style="display:none;">
      <p>Request sent. MyLocalTrades will reach out to connect you.</p>
    </div>

  </main>

  <footer class="footer">
    <p>MyLocalTrades - get things done.</p>
  </footer>

<script src="script.js" defer></script>
<script defer>
  window.addEventListener("DOMContentLoaded", async () => {
    const params = new URLSearchParams(window.location.search);
    let name = params.get("name") || "";
    const category = params.get("category") || "";

    const titleEl = document.getElementById("requestTitle");
    const subtitleEl = document.getElementById("requestSubtitle");
    const summaryEl = document.getElementById("providerSummary");
    const switchRow = document.getElementById("switchRow");
    const providerSwitch = document.getElementById("providerSwitch");
    const hiddenProvider = document.getElementById("hiddenProvider");
    const hiddenCategory = document.getElementById("hiddenCategory");

    hiddenCategory.value = category;

    // Renders the provider summary card (photo/stars/price/other)
    // for whichever provider is currently selected. Called on
    // initial load and again whenever someone picks a different
    // provider from the switch dropdown - never touches the form
    // fields below it, so typed-in info is never lost.
    function renderSummary(match) {
      if (!match) {
        summaryEl.style.display = "none";
        return;
      }
      let html = "";
      if (match.photo) {
        const photoUrl = toRawGithubUrl(match.photo);
        html += `<img class="provider-photo" src="${photoUrl}" alt="${match.name}" onerror="this.style.display='none'">`;
      }
      html += `<div class="provider-body">`;
      if (match.city || match.state) {
        const location = [match.city, match.state].filter(Boolean).join(", ");
        html += `<p class="provider-location">${location}</p>`;
      }
      if (match.stars) html += `<p class="provider-stars">${starsDisplay(match.stars)}</p>`;
      if (match.price) html += `<p class="provider-price">${match.price}</p>`;
      if (match.other) html += `<p class="provider-other">${match.other}</p>`;
      html += `</div>`;
      summaryEl.innerHTML = html;
      summaryEl.style.display = "flex";
    }

    function selectProvider(providerName, sameCategoryProviders) {
      name = providerName;
      const match = sameCategoryProviders.find((p) => p.name === providerName);

      titleEl.innerHTML = `Request<br><span class="accent">${name}</span>`;
      subtitleEl.textContent = category
        ? `${titleCase(category)} - tell us what you need and MyLocalTrades will reach out to connect you.`
        : `Tell us what you need and MyLocalTrades will reach out to connect you.`;

      hiddenProvider.value = name;
      renderSummary(match);

      // Update the URL quietly so refreshing/sharing the link
      // keeps whichever provider is currently selected - without
      // reloading the page or touching anything the person typed.
      const newParams = new URLSearchParams(window.location.search);
      newParams.set("name", providerName);
      history.replaceState(null, "", `${window.location.pathname}?${newParams.toString()}`);
    }

    if (!name) {
      subtitleEl.textContent = "Tell us what you need and MyLocalTrades will find the right person.";
    }

    if (category) {
      try {
        const res = await fetch("providers.txt");
        const text = await res.text();
        const all = parseProviders(text);
        const sameCategory = all.filter(
          (p) => p.category.toLowerCase() === category.toLowerCase()
        );

        // Only show the switcher if there's actually more than one
        // provider to switch to - no point showing a dropdown with
        // a single option.
        if (sameCategory.length > 1) {
          providerSwitch.innerHTML = "";
          for (const p of sameCategory) {
            const opt = document.createElement("option");
            opt.value = p.name;
            opt.textContent = p.name;
            if (p.name === name) opt.selected = true;
            providerSwitch.appendChild(opt);
          }
          switchRow.style.display = "flex";

          providerSwitch.addEventListener("change", () => {
            selectProvider(providerSwitch.value, sameCategory);
          });
        }

        if (name) {
          const initialMatch = sameCategory.find((p) => p.name === name);
          selectProvider(name, sameCategory);
          if (!initialMatch) renderSummary(null);
        }
      } catch (err) {
        console.error("Could not load provider details:", err);
      }
    } else if (name) {
      titleEl.innerHTML = `Request<br><span class="accent">${name}</span>`;
      hiddenProvider.value = name;
    }

    const form = document.getElementById("requestForm");
    const successMsg = document.getElementById("successMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = form.querySelector("button[type=submit]");
      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";

      try {
        const res = await fetch(form.action, {
          method: "POST",
          body: new FormData(form),
          headers: { Accept: "application/json" }
        });

        if (res.ok) {
          form.style.display = "none";
          successMsg.style.display = "block";
        } else {
          throw new Error("Form submission failed");
        }
      } catch (err) {
        console.error(err);
        submitBtn.disabled = false;
        submitBtn.textContent = "Send request";
        alert("Something went wrong sending your request. Please try again.");
      }
    });
  });
</script>
</body>
</html>
